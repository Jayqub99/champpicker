name: Nightly crawl

# Downloads new ranked matches into the hosted database every night.
# Needs these repository secrets (Settings > Secrets and variables > Actions):
#   DATABASE_URL  - the Neon database connection string (same one Vercel uses)
#   RIOT_API_KEY  - your Riot key (a personal-product key; dev keys expire daily)
#   RIOT_ID       - your Riot ID, e.g. Name#NA1 (for your own games and mastery)

on:
  schedule:
    - cron: "0 7 * * *"   # 2 AM Eastern (3 AM during daylight time)
  workflow_dispatch:
    inputs:
      max_requests:
        description: "Riot requests to spend (100 every 2 minutes)"
        default: "8000"

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
      RIOT_ID: ${{ secrets.RIOT_ID }}
      MAX_REQUESTS: ${{ github.event.inputs.max_requests || '8000' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Your mastery and recent games
        run: python -m pickhelper sync-me
        continue-on-error: true
      - name: Ladder players (first run only)
        run: python -m pickhelper seed --if-empty
      - name: Matches
        run: python -m pickhelper crawl --max-requests "$MAX_REQUESTS" --timeline-every 3
